[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-multi-agent-orchestrator"
version = "1.0.0"
description = "L3 reference multi-agent orchestration system with capability routing, traceable execution, and human approval gates"
requires-python = ">=3.10"
authors = [{name = "Mahsa Keikha"}]
license = {text = "MIT"}
readme = "README.md"
keywords = ["agentic-ai", "multi-agent", "orchestration", "ai-safety", "reference-architecture"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.setuptools.packages.find]
where = ["."]
include = ["AGENTS*", "TOOLS*", "SKILLS*", "orchestration*", "safety*", "observability*", "schemas*"]
namespaces = true
